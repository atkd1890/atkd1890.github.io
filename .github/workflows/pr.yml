name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck + unit tests + leak guard self-test
      # Phase 5: frontmatter validation.
      # Preview builds use public data only (no SHOWCASE_TOKEN): private stats come from the snapshot.
      # Preview and tests include drafts (DRAFTS=1), so the leak guard checks drafts before they merge.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRAFTS: '1'
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run og
      - run: npm run budget
      - run: npm run validate:html
      - run: npm run links # internal links and #anchors
      # Readers of /ja/ have a Japanese system font; without one, Chromium spends ~0.7 s per page on glyph fallback.
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run lighthouse # ≥ 95 in every category, mobile preset
      - run: npx playwright test --grep-invert @visual # e2e + axe on the built _site, 375px and 1280px
      - name: Leak guard (site, changed Markdown, commit authors)
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- '*.md' || true)
          node scripts/leak-guard.js _site $changed --commits=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        env:
          # Present for same-repo PRs, absent for forks (guard still checks canary + EXIF).
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-${{ github.event.pull_request.number }}
          path: lighthouse
          retention-days: 7
          if-no-files-found: ignore
