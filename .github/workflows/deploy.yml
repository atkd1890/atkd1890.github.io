name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # daily, 06:17 JST — refreshes GitHub data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck + unit tests + leak guard self-test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          STARS_EXCLUDE_OWNERS: ${{ secrets.STARS_EXCLUDE_OWNERS }}
      - name: Leak guard
        run: node scripts/leak-guard.js _site --require-denylist --fetch-private
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
