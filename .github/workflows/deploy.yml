name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *' # daily, 06:17 JST — refreshes GitHub data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck + unit tests + leak guard self-test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          STARS_EXCLUDE_OWNERS: ${{ secrets.STARS_EXCLUDE_OWNERS }}
      - name: Leak guard
        run: node scripts/leak-guard.js _site --require-denylist --fetch-private
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
