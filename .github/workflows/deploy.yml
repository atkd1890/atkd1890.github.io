name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # daily, 06:17 JST — refreshes GitHub data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Phase 2: github.js reads this; build must still pass without it.
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      # Phase 2: leak guard runs here and fails the build on any hit.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
