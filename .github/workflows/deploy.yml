name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *' # daily, 06:17 JST — refreshes GitHub data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # previous run's craft-stats artifact, for /colophon

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck + unit tests + leak guard self-test
      - name: Previous craft stats (Lighthouse, build time) for /colophon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow Deploy --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n craft-stats -D .cache/craft-ci || echo "no craft-stats yet"; fi
      - name: Build
        id: build
        run: |
          start=$(date +%s)
          npm run build
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          STARS_EXCLUDE_OWNERS: ${{ secrets.STARS_EXCLUDE_OWNERS }}
      - run: npx playwright install --with-deps chromium
      - run: npm run og # OG images, rendered from the built pages
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk # like real /ja/ readers (ADR 0008)
      - name: Lighthouse for the next /colophon (does not block; PRs gate on it)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: |
          mkdir -p craft-stats
          node scripts/lighthouse.js --summary=craft-stats/lighthouse.json --no-fail
          jq -n --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$RUN_URL" --argjson s "$BUILD_SECONDS" \
            --slurpfile lh craft-stats/lighthouse.json '{at: $at, run: $run, buildSeconds: $s, lighthouse: $lh[0]}' > craft-stats/craft-ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-stats
          path: craft-stats
          retention-days: 30
      - run: npm run budget
      - name: Leak guard
        run: node scripts/leak-guard.js _site --require-denylist --fetch-private --commits=HEAD
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          SHOWCASE_REPOS: ${{ secrets.SHOWCASE_REPOS }}
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true # /.well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  token-expiry:
    # Reminds the owner to rotate SHOWCASE_TOKEN: opens one issue 14 days before expiry,
    # or when the token has expired or is invalid. Runs with every deploy, including the daily cron.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        run: node scripts/check-token-expiry.js
        env:
          SHOWCASE_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}
      - name: Open reminder issue
        if: contains(fromJSON('["warn","expired","invalid"]'), steps.check.outputs.state)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          DAYS: ${{ steps.check.outputs.days }}
          EXPIRES: ${{ steps.check.outputs.expires }}
        run: |
          if [ -n "$(gh issue list --state open --search 'SHOWCASE_TOKEN in:title' --json number --jq '.[].number')" ]; then
            echo "Reminder issue already open"; exit 0
          fi
          case "$STATE" in
            warn) title="SHOWCASE_TOKEN expires in $DAYS days ($EXPIRES)";;
            expired) title="SHOWCASE_TOKEN expired on $EXPIRES";;
            invalid) title="SHOWCASE_TOKEN is invalid (401)";;
          esac
          gh issue create --title "$title" --body "$(cat <<'BODY'
          The site falls back to the snapshot when this token stops working, so stats stop updating.

          Rotate it (about 2 minutes):
          1. github.com → Settings → Developer settings → Fine-grained tokens → generate a new token: all repositories, **Metadata: Read-only** only, with an expiry date.
          2. `gh secret set SHOWCASE_TOKEN` in this repo and paste the new token.
          3. `gh workflow run Deploy`, then close this issue.

          Details: README → "Cấu hình GitHub" and docs/adr/0004.
          BODY
          )"
