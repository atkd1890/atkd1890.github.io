# Weekly updates, grouped so there is about one PR per ecosystem per week.
# Patch and minor PRs merge themselves once `check` and `gitleaks` are green (ADR 0010,
# .github/workflows/dependabot-auto-merge.yml). Major updates get their own PR and wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major pinned in mise.toml / .nvmrc; bump it together with Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
