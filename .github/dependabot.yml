version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      eleventy:
        patterns:
          - '@11ty/*'
      fonts:
        patterns:
          - '@fontsource*'
      types:
        patterns:
          - '@types/*'
          - typescript
    ignore:
      # @types/node follows the Node major pinned in mise.toml / .nvmrc; bump it together with Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
